<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Family Locator</title>
    <style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f3ee;color:#182126;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:white;border-radius:24px;padding:32px;max-width:420px;margin:24px;box-shadow:0 12px 40px #0002}h1{font-size:36px;margin:8px 0 12px}p{color:#627078;line-height:1.5}.eyebrow{color:#0e7c66;font-weight:800;letter-spacing:2px;font-size:12px}a,button{display:block;background:#0e7c66;color:white;padding:15px;border-radius:14px;text-align:center;text-decoration:none;font-weight:800;border:0;width:100%;box-sizing:border-box;font-size:16px}.code{background:#eef3f1;padding:12px;border-radius:10px;word-break:break-all;color:#182126}</style></head>
  <body><main class="card"><div class="eyebrow">PRIVATE INVITE</div><h1>Join your family circle</h1><p>Open this invite on the iPhone where Family Locator is installed.</p><p class="code" id="code"></p><a id="open" href="#">Open Family Locator</a><p>If the app does not open, copy the code above and paste it in the Invite tab.</p></main>
    <script>const id=location.pathname.split('/').filter(Boolean).pop()||'';document.getElementById('code').textContent=id;document.getElementById('open').href='familylocator://invite/'+encodeURIComponent(id);</script>
  </body>
</html>
