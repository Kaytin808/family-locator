name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Write Firebase configuration
        env:
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_PLIST" ]; then
            echo "$FIREBASE_PLIST" | base64 --decode > ios/FamilyLocator/GoogleService-Info.plist
            sed -i '' 's/firebaseConfigured = false/firebaseConfigured = true/' src/config/build.ts
          else
            cp ios/FamilyLocator/GoogleService-Info.plist.example ios/FamilyLocator/GoogleService-Info.plist
            echo "::warning::Using placeholder Firebase configuration. The app will open to setup instructions; Firebase features need the repository secret."
          fi
      - name: Install CocoaPods
        run: cd ios && bundle install && bundle exec pod install
      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/FamilyLocator.xcworkspace -scheme FamilyLocator -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/FamilyLocator.app
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload FamilyLocator-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyLocator-unsigned-ipa
          path: build/FamilyLocator-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
