name: Build signed iOS IPA

on:
  workflow_dispatch:
  # A free Personal Team profile still has to be renewed manually every 7 days.
  # schedule:
  #   - cron: '0 8 */6 * *'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Write Firebase configuration
        env:
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$FIREBASE_PLIST"
          echo "$FIREBASE_PLIST" | base64 --decode > ios/FamilyLocator/GoogleService-Info.plist
          sed -i '' 's/firebaseConfigured = false/firebaseConfigured = true/' src/config/build.ts
      - name: Install CocoaPods
        run: cd ios && bundle install && bundle exec pod install
      - name: Install signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/family-locator.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Select app entitlements
        env:
          ENABLE_PUSH: ${{ secrets.ENABLE_PUSH_NOTIFICATIONS }}
        run: |
          if [ "$ENABLE_PUSH" = "true" ]; then
            echo "APP_ENTITLEMENTS=FamilyLocator/FamilyLocatorPush.entitlements" >> "$GITHUB_ENV"
          else
            echo "APP_ENTITLEMENTS=FamilyLocator/FamilyLocator.entitlements" >> "$GITHUB_ENV"
          fi
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          xcodebuild -workspace ios/FamilyLocator.xcworkspace -scheme FamilyLocator -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/FamilyLocator.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGN_ENTITLEMENTS="$APP_ENTITLEMENTS" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY="Apple Development"
      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string development' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID" "$EXPORT_PLIST"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FamilyLocator.xcarchive" -exportPath build -exportOptionsPlist "$EXPORT_PLIST"
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyLocator-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14
